name: Tests

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - '.github/workflows/ci.yml'
      - 'bin/**'
      - 'bucket/**'
      - 'deprecated/**'
      - 'scripts/**'
      - 'Scoop-Bucket.Tests.ps1'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'bin/**'
      - 'bucket/**'
      - 'deprecated/**'
      - 'scripts/**'
      - 'Scoop-Bucket.Tests.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell
            name: WindowsPowerShell
          - shell: pwsh
            name: PowerShell
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          path: my_bucket

      - name: Checkout Scoop
        uses: actions/checkout@v7
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core

      - name: Install test modules
        shell: ${{ matrix.shell }}
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module BuildHelpers -MinimumVersion 2.0.1 -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.2.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Test Bucket
        shell: ${{ matrix.shell }}
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\bin\test.ps1
